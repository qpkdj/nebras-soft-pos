name: Build Nebras SofT Pos APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: جلب كود المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد بيئة Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: توليد مجلد Android تلقائياً
        run: flutter create --platforms=android .

      - name: ضبط التوافق من Android 10 وحتى أحدث إصدار
        run: |
          python3 - << 'EOF'
          import os

          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"

          if os.path.exists(kts_path):
              with open(kts_path, "r", encoding="utf-8") as f:
                  gradle = f.read()
              gradle = gradle.replace("minSdk = flutter.minSdkVersion", "minSdk = 29")
              with open(kts_path, "w", encoding="utf-8") as f:
                  f.write(gradle)
          elif os.path.exists(groovy_path):
              with open(groovy_path, "r", encoding="utf-8") as f:
                  gradle = f.read()
              gradle = gradle.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 29")
              gradle = gradle.replace("minSdk = flutter.minSdkVersion", "minSdk = 29")
              with open(groovy_path, "w", encoding="utf-8") as f:
                  f.write(gradle)
          EOF

      - name: حقن الأذونات وإعدادات التخزين والصوت في AndroidManifest
        run: |
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          perms = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.WRITE_CONTACTS"/>
          """

          queries = """    <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <package android:name="com.google.android.googlequicksearchbox" />
              </queries>
          """

          if "android.permission.CAMERA" not in content:
              content = content.replace(
                  "<application",
                  perms + '\n    <application android:requestLegacyExternalStorage="true"',
                  1
              )

          if "RecognitionService" not in content:
              content = content.replace("</manifest>", queries + "\n</manifest>", 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: تحميل المكتبات
        run: flutter pub get

      - name: تجهيز وتركيب أيقونة التطبيق المخصصة (NS sofT POS)
        run: |
          python3 - << 'EOF'
          import os, glob, subprocess

          os.makedirs("assets", exist_ok=True)
          candidates = [
              "assets/logo.png",
              "assets/app_icon.png.jpg",
              "assets/app_icon.png",
              "assets/app_icon.jpg",
              "app_icon.png.jpg",
              "app_icon.png",
              "app_icon.jpg",
              "logo.png",
              "logo.jpg",
          ] + glob.glob("assets/*")

          found = None
          for c in candidates:
              if os.path.isfile(c) and c.lower().endswith((".png", ".jpg", ".jpeg", ".webp")):
                  found = c
                  break

          if found:
              print("Found custom icon file:", found)
              try:
                  from PIL import Image
              except ImportError:
                  subprocess.run(["pip", "install", "-q", "Pillow"], check=False)
                  from PIL import Image
              img = Image.open(found).convert("RGBA").resize((1024, 1024))
              img.save("assets/logo.png", format="PNG")
              print("Converted and saved clean PNG to assets/logo.png")
          else:
              print("No custom icon image found in repository.")
          EOF
          if [ -f "assets/logo.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            dart run flutter_launcher_icons
          fi

      - name: تحديث توافق مكتبة file_picker مع Android API 36
        run: |
          python3 - << 'EOF'
          import glob, os, re

          pub_cache = os.environ.get("PUB_CACHE", os.path.expanduser("~/.pub-cache"))
          pattern = os.path.join(pub_cache, "hosted", "*", "file_picker-*", "android", "build.gradle*")
          for path in glob.glob(pattern):
              with open(path, "r", encoding="utf-8") as f:
                  s = f.read()
              s = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 36", s)
              s = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", s)
              s = re.sub(r"compileSdk\s+\d+", "compileSdk 36", s)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(s)
              print("Patched compileSdk 36 in:", path)
          EOF

      - name: بناء ملف APK النهائي
        run: flutter build apk --release --no-shrink

      - name: رفع ملف APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Nebras-SofT-Pos-APK
          path: build/app/outputs/flutter-apk/app-release.apk
