name: Build Nebras SofT Pos APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android & Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter create --org com.nebrassoft --project-name nebras_soft_pos --platforms=android .
          sed -i 's/android:label="[^"]*"/android:label="Nebras SofT Pos"/' android/app/src/main/AndroidManifest.xml

          if [ -f "lib/main.dart" ]; then
            sed -i 's/Future> getSettingsMap()/Future\x3cMap\x3cString, String\x3e\x3e getSettingsMap()/g' lib/main.dart
            sed -i 's/Future> evaluateUpdateStatus(/Future\x3cMap\x3cString, dynamic\x3e\x3e evaluateUpdateStatus(/g' lib/main.dart
            sed -i 's/Future> getContactStatementData(/Future\x3cMap\x3cString, dynamic\x3e\x3e getContactStatementData(/g' lib/main.dart
            sed -i 's/Future> getCashboxSummary(/Future\x3cMap\x3cString, dynamic\x3e\x3e getCashboxSummary(/g' lib/main.dart
            sed -i 's/Future> getFinancialSummary(/Future\x3cMap\x3cString, dynamic\x3e\x3e getFinancialSummary(/g' lib/main.dart
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E 's/(compileSdk(Version)?)[[:space:]]*(=|\()[[:space:]]*[^)[:space:]]+\)?/\1 = 36/g' android/app/build.gradle.kts
            sed -i -E 's/(targetSdk(Version)?)[[:space:]]*(=|\()[[:space:]]*[^)[:space:]]+\)?/\1 = 36/g' android/app/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/(compileSdkVersion)[[:space:]]+[^[:space:]]+/\1 36/g' android/app/build.gradle
            sed -i -E 's/(targetSdkVersion)[[:space:]]+[^[:space:]]+/\1 36/g' android/app/build.gradle
          fi

          if [ -f "android/build.gradle.kts" ]; then
            if ! grep -q "subprojects" android/build.gradle.kts; then
              printf '\nsubprojects {\n    afterEvaluate {\n        val androidExt = extensions.findByName("android")\n        if (androidExt != null) {\n            try {\n                val m = androidExt.javaClass.getMethod("compileSdk", Int::class.javaPrimitiveType)\n                m.invoke(androidExt, 36)\n            } catch (_: Exception) {}\n        }\n    }\n}\n' >> android/build.gradle.kts
            fi
          fi

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/nebras-release.jks
          fi

          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Nebras-SofT-Pos-APK
          path: build/app/outputs/flutter-apk/app-release.apk
