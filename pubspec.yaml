name: nebras_soft_pos
description: "Nebras SofT Pos offline accounting and point of sale application."
publish_to: 'none'

version: 1.6.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  mobile_scanner: ^5.2.3
  pdf: ^3.11.1
  printing: ^5.13.3
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
