name: nebras_soft_pos
description: نظام نبراس SofT المحاسبي المتكامل لنقاط البيع وإدارة المخزون.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  mobile_scanner: ^6.0.2
  printing: ^5.13.4
  pdf: ^3.11.1
  share_plus: ^10.1.2
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.1
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0D2A7A"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
