name: nebras_soft_pos
description: نظام نبراس SofT المحاسبي ونقاط البيع
publish_to: 'none'
version: 1.6.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الأيقونات
  cupertino_icons: ^1.0.8

  # قاعدة البيانات المحلية والمسارات
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # قارئ الباركود بالكاميرا (متوافق مع كود BarcodeScannerScreen)
  mobile_scanner: ^5.2.3

  # إدارة الأذونات والتراخيص
  permission_handler: ^11.3.1

  # الطباعة الحرارية وتوليد ملصقات الباركود وملفات PDF بالخط العربي
  pdf: ^3.11.1
  printing: ^5.13.4

  # النسخ الاحتياطي واختيار الملفات والمشاركة والروابط الخارجية
  file_picker:
  share_plus: ^10.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
